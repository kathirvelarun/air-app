[project]
name = "air-agent-app"
version = "0.1.0"
description = "AIR investigation agent: a step-by-step Python implementation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "openai>=2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1", "anyio>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
